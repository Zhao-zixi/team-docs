name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests, build, and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck client and server
        run: npm run typecheck
      - name: Unit, API, and operations tests
        run: npm test
      - name: Deployment script syntax and fail-closed mocks
        shell: bash
        run: |
          set -euo pipefail
          for script in deploy/release.sh deploy/test-release-preflight.sh deploy/test-release-lifecycle.sh deploy/source-up.sh deploy/test-source-up.sh deploy/nas-up.sh deploy/test-nas-up.sh; do bash -n "$script"; done
          bash deploy/test-release-preflight.sh
          bash deploy/test-release-lifecycle.sh backup-failure
          bash deploy/test-release-lifecycle.sh health-failure
          bash deploy/test-source-up.sh
          bash deploy/test-nas-up.sh
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Production browser E2E
        run: npm run test:e2e
      - name: Build and test the production stdio bridge
        run: npm run test:stdio:production

  windows-wrapper-tests:
    name: Windows PowerShell wrapper argv tests
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test Git Bash source wrapper argument boundaries
        shell: pwsh
        run: ./deploy/test-source-up.ps1
      - name: Test GitHub CD wrapper validation and argv
        shell: pwsh
        run: ./deploy/test-deploy-release.ps1

  source-compose-smoke:
    name: Source Compose first install, redeploy, and backup smoke
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: First install, same-volume redeploy, and backup smoke
        run: node .github/scripts/source-smoke.mjs

  docker-smoke:
    name: Docker build and hardened health smoke
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build local image
        run: docker build --pull --tag teamshelf:ci .
      - name: Run and inspect hardened container
        shell: bash
        run: |
          set -euo pipefail
          name="teamshelf-ci-${GITHUB_RUN_ID}"
          volume="teamshelf-ci-${GITHUB_RUN_ID}"
          cleanup() {
            docker rm --force "$name" >/dev/null 2>&1 || true
            docker volume rm "$volume" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker volume create "$volume" >/dev/null
          docker run --detach --name "$name" \
            --publish 18080:3000 \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --volume "$volume:/app/data" \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --env NODE_ENV=production \
            --env PORT=3000 \
            --env DATA_DIR=/app/data \
            --env APP_ORIGIN=http://127.0.0.1:18080 \
            --env COOKIE_SECURE=false \
            --env SETUP_TOKEN=ci-only-ephemeral-setup-token-not-for-production \
            teamshelf:ci >/dev/null
          user="$(docker inspect --format '{{.Config.User}}' "$name")"
          read_only="$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$name")"
          caps="$(docker inspect --format '{{join .HostConfig.CapDrop ","}}' "$name")"
          security="$(docker inspect --format '{{json .HostConfig.SecurityOpt}}' "$name")"
          test "$user" = node
          test "$read_only" = true
          test "$caps" = ALL
          [[ "$security" == *no-new-privileges:true* ]]
          for attempt in $(seq 1 45); do
            health="$(docker inspect --format '{{.State.Health.Status}}' "$name" 2>/dev/null || true)"
            if [[ "$health" == healthy ]]; then break; fi
            if [[ "$health" == unhealthy ]]; then docker logs "$name"; exit 1; fi
            sleep 2
          done
          test "${health:-}" = healthy || { docker logs "$name"; exit 1; }
          curl --fail --silent --show-error http://127.0.0.1:18080/api/health
  publish-image:
    name: Publish and verify immutable GHCR image
    needs: [docker-smoke, source-compose-smoke, windows-wrapper-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish unique multi-platform candidate
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/zhao-zixi/team-docs:sha-${{ github.sha }}-run-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.source=https://github.com/Zhao-zixi/team-docs
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: First install, same-digest redeploy, and backup smoke
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
          SMOKE_ROOT: ${{ runner.temp }}/teamshelf-release-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ ! -e .env ]] || { echo 'Refusing to overwrite a pre-existing .env in the CI checkout.' >&2; exit 1; }
          image_ref="ghcr.io/zhao-zixi/team-docs@$IMAGE_DIGEST"
          project="teamshelfci$GITHUB_RUN_ID$GITHUB_RUN_ATTEMPT"
          volume="$project-data"
          backup_dir="$SMOKE_ROOT/backups"
          state_file="$SMOKE_ROOT/smoke-state.json"
          origin=http://127.0.0.1:18080
          mkdir -p "$SMOKE_ROOT"
          cleanup() {
            if [[ -f .env ]]; then docker compose --env-file .env -p "$project" -f deploy/compose.release.yaml down --remove-orphans >/dev/null 2>&1 || true; fi
            docker volume rm "$volume" >/dev/null 2>&1 || true
            rm -f .env
            rm -rf "$SMOKE_ROOT"
          }
          trap cleanup EXIT
          bash deploy/nas-up.sh --project "$project" --volume "$volume" --backup-dir "$backup_dir" --origin "$origin" --port 18080 --cookie-secure false --image-ref "$image_ref" --init-volume
          [[ -f .env ]]
          setup_token="$(awk -F= '$1 == "SETUP_TOKEN" { print substr($0, index($0, "=") + 1) }' .env)"
          [[ -n "$setup_token" ]]
          export APP_ORIGIN="$origin" SETUP_TOKEN="$setup_token" RELEASE_SMOKE_STATE="$state_file"
          node .github/scripts/release-smoke.mjs initialize
          bash deploy/nas-up.sh --image-ref "$image_ref"
          node .github/scripts/release-smoke.mjs verify
          backup_file="$(find "$backup_dir" -maxdepth 1 -type f -name 'teamshelf-*.sqlite' -print -quit)"
          [[ -n "$backup_file" && -s "$backup_file" ]]
          document_id="$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).documentId)' "$state_file")"
          [[ "$document_id" =~ ^[0-9a-f-]{36}$ ]]
          docker run --rm --network none --user 1000:1000 \
            --mount "type=bind,src=$backup_dir,dst=/backup,readonly" \
            --env BACKUP_FILE="$(basename -- "$backup_file")" \
            --env DOCUMENT_ID="$document_id" \
            --entrypoint node "$image_ref" --input-type=module -e '
              import { DatabaseSync } from "node:sqlite";
              const db = new DatabaseSync("/backup/" + process.env.BACKUP_FILE, { readOnly: true });
              try {
                if (db.prepare("PRAGMA integrity_check").get()?.integrity_check !== "ok") throw new Error("integrity check failed");
                const row = db.prepare("SELECT body, version FROM documents WHERE id = ?").get(process.env.DOCUMENT_ID);
                if (row?.body !== "CI release persistence smoke body" || row.version !== 1) throw new Error("backup content mismatch");
              } finally { db.close(); }
              process.stdout.write("Release backup integrity and content verified in the image runtime.\n");
            '
      - name: Create immutable release metadata after smoke passes
        env:
          SOURCE_SHA: ${{ github.sha }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          node -e 'const fs=require("node:fs"); fs.writeFileSync("release-metadata.json", JSON.stringify({sourceSha:process.env.SOURCE_SHA,imageRef:`ghcr.io/zhao-zixi/team-docs@${process.env.IMAGE_DIGEST}`},null,2)+"\n")'
      - name: Upload release metadata for verified deployments
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-metadata
          path: release-metadata.json
          if-no-files-found: error
          retention-days: 90
          overwrite: true
